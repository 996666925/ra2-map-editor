[package]
name = "ra2-map-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
ui-test-video = ["egui_kittest/video", "egui_kittest/wgpu"]

[dependencies]
ra2-map-document.workspace = true
ra2-map-assets.workspace = true
ra2-map-scene.workspace = true
ra2-map-render.workspace = true
ra2-map-io.workspace = true
anyhow.workspace = true
eframe.workspace = true
image.workspace = true
log.workspace = true
rfd.workspace = true
serde_json.workspace = true
serde.workspace = true
wgpu.workspace = true
vera20k-core.workspace = true
self_update = { version = "1.3.3", default-features = false, features = ["manifest", "github", "reqwest", "rustls", "checksums"] }
semver = "1"

[target.'cfg(windows)'.dependencies]
tempfile = "3"

[dev-dependencies]
tempfile = "3"
vera20k-core = { workspace = true, features = ["test-support"] }
egui_system_font_provider = "=0.37.0"
egui_kittest.workspace = true
ra2-map-document = { workspace = true, features = ["test-support"] }
ra2-map-assets = { workspace = true, features = ["test-support"] }
