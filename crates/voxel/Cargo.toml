[package]
name = "ra2-map-voxel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The included engine modules have in-crate tests depending on its full client.
# Editor integration tests exercise this adapter through the assets crate.
[lib]
test = false
doctest = false

# The included renderer sources name the engine's private test groups. Recognize
# those cfgs without enabling its client-only tests in this adapter.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(tests_render_a_r)",
    "cfg(tests_render_s_z)",
    "cfg(tests_app_presentation_instances)",
    "cfg(tests_app_presentation_render)",
] }

[dependencies]
vera20k-core.workspace = true
glam.workspace = true
wgpu.workspace = true
pollster = "0.4"
log.workspace = true
bytemuck.workspace = true
