name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.1
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwayland-dev libxkbcommon-dev pkg-config

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Compute version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package
        env:
          RA2_RELEASE_LABEL: ${{ steps.version.outputs.version }}
          RA2_RELEASE_TARGET: ${{ matrix.target }}
          RA2_RELEASE_PLATFORM: ${{ matrix.platform }}
          RA2_MAP_EDITOR_GITHUB_REPOSITORY: ${{ github.repository }}
        run: just release "$RA2_RELEASE_LABEL" "$RA2_RELEASE_TARGET"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/ra2-map-editor-*
            dist/manifest.json
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Compute version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          prerelease: ${{ github.ref_type != 'tag' }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/*/ra2-map-editor-*
            ${{ github.ref_type == 'tag' && 'dist/*/manifest.json' || '' }}
          body: |
            - 各平台 ZIP 仅包含便携编辑器和 README，不内置 Node.js 或任务工具链。
            - 编译任务项目需要系统 Node.js 和项目本地构建依赖。
            - 首次启动时在窗口中选择游戏资源目录。
