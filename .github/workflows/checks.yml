name: Checks

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: pwsh

jobs:
  checks:
    name: Check windows-x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Keep in sync with rust-toolchain.toml.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: ./tools/format_workspace.ps1 -Check

      - name: Check translations
        run: python tools/check_i18n.py

      - name: Clippy all targets
        run: cargo clippy --locked --workspace --no-deps --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --locked --workspace
